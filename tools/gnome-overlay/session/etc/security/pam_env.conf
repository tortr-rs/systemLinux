# systemLinux: programs installed with goget (nixpkgs) are found from every session, including GNOME
PATH          DEFAULT=/usr/local/bin:/usr/bin:/bin:@{HOME}/.local/state/goget/profile/current/bin:/nix/var/goget/profiles/system/current/bin
XDG_DATA_DIRS DEFAULT=@{HOME}/.local/state/goget/profile/current/share:/nix/var/goget/profiles/system/current/share:/usr/local/share:/usr/share

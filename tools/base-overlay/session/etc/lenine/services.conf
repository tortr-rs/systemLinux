# started and supervised by lenine: [after=a,b] [mem=<size>] [cpu=<pct>%] <name> <command> [args...]
elogind /usr/local/bin/start-elogind
after=dbus polkitd /usr/local/bin/start-polkitd
after=dbus,polkitd bluetoothd /usr/local/bin/start-bluetoothd
chronyd /usr/local/bin/start-chronyd
after=dbus,polkitd power-profiles-daemon /nix/var/goget/profiles/system/current/libexec/power-profiles-daemon
audio /usr/local/bin/start-audio
nftables-load /usr/local/bin/start-nftables
after=dbus,polkitd cupsd /usr/local/bin/start-cupsd
after=dbus,polkitd fwupd /usr/local/bin/start-fwupd

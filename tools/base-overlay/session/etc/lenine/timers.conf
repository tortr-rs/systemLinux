# run on a fixed interval by lenine (not supervised as an always-on daemon): <name> every=<duration> <command> [args...]
# a lightweight CLI update notifier: `goget upgrade --check` just looks and logs, never installs
# anything on its own. See it with `lenine status` (last exit 0 = checked fine, non-zero = the
# check itself failed, e.g. no network -- not "an update is available") or `lenine log goget-check`.
goget-check every=12h /usr/local/bin/goget upgrade --check
